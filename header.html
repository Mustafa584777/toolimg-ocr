<!-- ===================================================================
                 CORE INTERACTIVE LOGIC (SCRIPTS IN HEADER)
     =================================================================== 
     Niche diye gaye logic se saare dynamic drop-downs, translation, 
     aur dynamic authentication features bina kisi lag ke perfectly run honge.
-->
<script>
    // -------------------------------------------------------------
    // 1. THEME TOGGLE, PERSISTENCE AND ACTIVE ICON SYNCHRONIZATION
    // -------------------------------------------------------------
    function updateThemeUI(theme) {
        ['light', 'dark', 'system'].forEach(t => {
            const btn = document.getElementById('theme-' + t + '-btn');
            if (btn) {
                const check = btn.querySelector('.check-icon');
                if (check) {
                    if (t === theme) {
                        check.classList.remove('hidden');
                        btn.classList.add('bg-[#fafafa]', 'dark:bg-neutral-900', 'text-black', 'dark:text-gray-100');
                        btn.classList.remove('text-gray-600', 'dark:text-gray-400');
                    } else {
                        check.classList.add('hidden');
                        btn.classList.remove('bg-[#fafafa]', 'dark:bg-neutral-900', 'text-black', 'dark:text-gray-100');
                        btn.classList.add('text-gray-600', 'dark:text-gray-400');
                    }
                }
            }
        });
    }

    function setTheme(theme) {
        if (theme === 'system') {
            localStorage.removeItem('theme');
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        } else {
            localStorage.theme = theme;
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }
        updateThemeUI(theme);
    }

    // Initial theme trigger
    const initialTheme = localStorage.theme || 'light';
    if (initialTheme === 'dark') {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
    }

    document.addEventListener('DOMContentLoaded', () => {
        updateThemeUI(initialTheme);
        
        // Desktop Theme button handler
        const desktopThemeBtn = document.getElementById('theme-btn-desktop');
        const mobileHeaderThemeBtn = document.getElementById('theme-btn');
        
        const toggleHandler = () => {
            if (document.documentElement.classList.contains('dark')) {
                setTheme('light');
            } else {
                setTheme('dark');
            }
        };

        if (desktopThemeBtn) desktopThemeBtn.addEventListener('click', toggleHandler);
        if (mobileHeaderThemeBtn) mobileHeaderThemeBtn.addEventListener('click', toggleHandler);

        // Mobile drawer sub-menu popover trigger
        const mobileThemeBtn = document.getElementById('theme-menu-btn');
        const themePopover = document.getElementById('theme-popover');
        if (mobileThemeBtn && themePopover) {
            mobileThemeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                themePopover.classList.toggle('hidden');
                if (!themePopover.classList.contains('hidden')) {
                    themePopover.classList.add('flex');
                } else {
                    themePopover.classList.remove('flex');
                }
            });
        }
    });

    // -------------------------------------------------------------
    // 2. GOOGLE TRANSLATE HANDLER (DROPDOWN TRIGGER & COOKIE SYNC)
    // -------------------------------------------------------------
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'en',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false
        }, 'google_translate_element');
    }

    function toggleLangMenu(e) {
        if (e) e.stopPropagation();
        const popover = document.getElementById('lang-popover');
        if (popover) {
            popover.classList.toggle('hidden');
            if (!popover.classList.contains('hidden')) {
                popover.classList.add('flex');
            } else {
                popover.classList.remove('flex');
            }
        }
    }

    function switchLang(lang) {
        const prevLang = localStorage.getItem('selected_lang') || 'en';
        localStorage.setItem('prev_lang', prevLang);
        localStorage.setItem('selected_lang', lang);
        
        const clearCookie = (name, domain) => {
            let cookieStr = name + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            if (domain) cookieStr += " domain=" + domain + ";";
            document.cookie = cookieStr;
            document.cookie = cookieStr + " SameSite=None; Secure;";
        };

        clearCookie('googtrans');
        clearCookie('googtrans', window.location.hostname);
        clearCookie('googtrans', '.' + window.location.hostname);
        
        const parts = window.location.hostname.split('.');
        if (parts.length > 2) {
            const mainDomain = parts.slice(-2).join('.');
            clearCookie('googtrans', mainDomain);
            clearCookie('googtrans', '.' + mainDomain);
        }

        if (lang !== 'en') {
            const setCookie = (value, domain) => {
                let base = "googtrans=" + value + "; path=/; SameSite=None; Secure;";
                if (domain) base += " domain=" + domain + ";";
                document.cookie = base;
            };
            
            setCookie('/en/' + lang);
            setCookie('/en/' + lang, window.location.hostname);
            setCookie('/en/' + lang, '.' + window.location.hostname);
            if (parts.length > 2) {
                const mainDomain = parts.slice(-2).join('.');
                setCookie('/en/' + lang, mainDomain);
                setCookie('/en/' + lang, '.' + mainDomain);
            }
        }

        const select = document.querySelector('#google_translate_element select') || document.querySelector('.goog-te-combo');
        if (select) {
            select.value = lang;
            select.dispatchEvent(new Event('change'));
        }
        setTimeout(() => {
            window.location.reload();
        }, 120);
    }

    // -------------------------------------------------------------
    // 3. MOBILE MENU MODAL / DRAWER INTERACTIVE ANIMATION LOGIC
    // -------------------------------------------------------------
    document.addEventListener('DOMContentLoaded', () => {
        const mobileBtn = document.getElementById('mobile-menu-btn');
        const mobileCloseBtn = document.getElementById('mobile-menu-close');
        const mobileModal = document.getElementById('mobile-menu-modal');
        const mobileBackdrop = document.getElementById('mobile-menu-backdrop');
        const mobileContent = document.getElementById('mobile-menu-content');
        
        function openMobileMenu() {
            if (!mobileModal) return;
            mobileModal.classList.remove('hidden');
            mobileModal.classList.add('flex');
            void mobileModal.offsetWidth; // trigger layout calculation for animation
            if (mobileBackdrop) {
                mobileBackdrop.classList.remove('opacity-0');
                mobileBackdrop.classList.add('opacity-100');
            }
            if (mobileContent) {
                mobileContent.classList.remove('scale-95', 'opacity-0');
                mobileContent.classList.add('scale-100', 'opacity-100');
            }
        }
        
        function closeMobileMenu() {
            if (!mobileModal) return;
            if (mobileBackdrop) {
                mobileBackdrop.classList.remove('opacity-100');
                mobileBackdrop.classList.add('opacity-0');
            }
            if (mobileContent) {
                mobileContent.classList.remove('scale-100', 'opacity-100');
                mobileContent.classList.add('scale-95', 'opacity-0');
            }
            setTimeout(() => {
                mobileModal.classList.add('hidden');
                mobileModal.classList.remove('flex');
                
                // Also auto-hide sub theme popover if open when drawer is closed
                const themePopover = document.getElementById('theme-popover');
                if (themePopover) {
                    themePopover.classList.add('hidden');
                    themePopover.classList.remove('flex');
                }
            }, 200);
        }
        
        if (mobileBtn) mobileBtn.addEventListener('click', openMobileMenu);
        if (mobileCloseBtn) mobileCloseBtn.addEventListener('click', closeMobileMenu);
        if (mobileBackdrop) mobileBackdrop.addEventListener('click', closeMobileMenu);
    });

    // Universal Dropdown Auto-Close on Outside Clicks
    document.addEventListener('click', (e) => {
        const userDropdown = document.getElementById('user-dropdown');
        const userBtn = document.getElementById('user-avatar-btn');
        if (userDropdown && !userDropdown.classList.contains('hidden') && userBtn && !userBtn.contains(e.target) && !userDropdown.contains(e.target)) {
            userDropdown.classList.add('hidden');
            userDropdown.classList.remove('flex');
        }
        
        const langPopover = document.getElementById('lang-popover');
        const langBtn = document.getElementById('lang-menu-btn');
        if (langPopover && !langPopover.classList.contains('hidden') && langBtn && !langBtn.contains(e.target) && !langPopover.contains(e.target)) {
            langPopover.classList.add('hidden');
            langPopover.classList.remove('flex');
        }
        
        const themePopover = document.getElementById('theme-popover');
        const themeMenuBtn = document.getElementById('theme-menu-btn');
        if (themePopover && !themePopover.classList.contains('hidden') && themeMenuBtn && !themeMenuBtn.contains(e.target) && !themePopover.contains(e.target)) {
            themePopover.classList.add('hidden');
            themePopover.classList.remove('flex');
        }
    });
</script>

<!-- ===================================================================
              4. FIREBASE AUTHENTICATION & CREDIT STATE SYNCHRONIZATION
     =================================================================== 
     Ye block directly user collection snapshot bind karta hai iske saare state ko 
     header elements me dynamically reflect karne ke liye.
-->
<script type="module">
    import { auth, db } from '/assets/firebase-config.js';
    import { signInWithPopup, signInWithRedirect, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const provider = new GoogleAuthProvider();

    // Global Login Helper (Available inline)
    window.handleLogin = async function() {
        if (!auth) {
            alert("Firebase not found. Please verify assets/firebase-config.js credentials.");
            return;
        }
        try {
            await signInWithPopup(auth, provider);
        } catch (error) {
            if (error.code === 'auth/popup-closed-by-user' || error.code === 'auth/cancelled-popup-request') {
                console.log('Popup window closed by user.');
                return;
            }
            console.warn("Popup blocked, trying redirect method:", error);
            try {
                await signInWithRedirect(auth, provider);
            } catch (redirectError) {
                console.error("Login redirect failed:", redirectError);
                alert("Login failed: " + (redirectError.message || error.message));
            }
        }
    };

    window.handleLogout = async function() {
        if (auth) {
            try {
                await signOut(auth);
                window.location.reload();
            } catch (error) {
                console.error("Signout failed:", error);
            }
        }
    };

    window.toggleUserDropdown = function(e) {
        if (e) e.stopPropagation();
        const dropdown = document.getElementById('user-dropdown');
        if (dropdown) {
            dropdown.classList.toggle('hidden');
            if (!dropdown.classList.contains('hidden')) {
                dropdown.classList.add('flex');
            } else {
                dropdown.classList.remove('flex');
            }
        }
    }

    // DOM Nodes caching
    const userAvatar = document.getElementById('user-avatar');
    const userFallback = document.getElementById('user-fallback');
    const userName = document.getElementById('user-name');
    const mobileUsername = document.getElementById('mobile-username');
    
    const headerAuthGuest = document.getElementById('header-auth-guest');
    const userMenu = document.getElementById('user-menu');
    const dashboardNav = document.getElementById('dashboard-nav');
    const mobileDashboardNav = document.getElementById('mobile-dashboard-nav');
    const creditsDisplay = document.getElementById('credits-display');
    const creditsCount = document.getElementById('credits-count');

    const mobileAuthGuest = document.getElementById('mobile-auth-guest');
    const mobileAuthUser = document.getElementById('mobile-auth-user');

    const generateBtn = document.getElementById('generate-btn');

    let currentUser = null;
    let creditsUnsub = null;

    if (auth) {
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                
                // Show/hide elements for Authenticated state (Desktop)
                if (headerAuthGuest) headerAuthGuest.classList.add('hidden');
                if (userMenu) userMenu.classList.remove('hidden');
                if (dashboardNav) dashboardNav.classList.remove('hidden');
                
                // Show/hide elements for Authenticated state (Mobile Drawer)
                if (mobileAuthGuest) mobileAuthGuest.classList.add('hidden');
                if (mobileAuthUser) mobileAuthUser.classList.remove('hidden');
                if (mobileDashboardNav) mobileDashboardNav.classList.remove('hidden');
                
                // Display profile details
                if (userAvatar && user.photoURL) {
                    userAvatar.src = user.photoURL;
                    userAvatar.classList.remove('hidden');
                    if (userFallback) userFallback.classList.add('hidden');
                }
                
                const formattedName = user.displayName || user.email.split('@')[0];
                if (userName) userName.textContent = formattedName;
                if (mobileUsername) mobileUsername.textContent = formattedName;

                // Sync Live credits count from Firestore
                if (creditsDisplay) {
                    creditsDisplay.classList.remove('hidden');
                    creditsDisplay.classList.add('flex');
                }

                const userRef = doc(db, 'users', user.uid);
                creditsUnsub = onSnapshot(userRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.data();
                        const creditBal = data.credits || 0;
                        if (creditsCount) creditsCount.textContent = creditBal;
                    }
                }, (error) => {
                    console.error("Firestore balance sync failed:", error);
                });
            } else {
                currentUser = null;
                if (creditsUnsub) {
                    creditsUnsub();
                    creditsUnsub = null;
                }
                
                // Show/hide elements for Guest state (Desktop)
                if (headerAuthGuest) {
                    headerAuthGuest.classList.remove('hidden');
                    headerAuthGuest.classList.add('flex');
                }
                if (userMenu) userMenu.classList.add('hidden');
                if (dashboardNav) dashboardNav.classList.add('hidden');
                if (creditsDisplay) {
                    creditsDisplay.classList.add('hidden');
                    creditsDisplay.classList.remove('flex');
                }

                // Show/hide elements for Guest state (Mobile Drawer)
                if (mobileAuthGuest) mobileAuthGuest.classList.remove('hidden');
                if (mobileAuthUser) mobileAuthUser.classList.add('hidden');
                if (mobileDashboardNav) mobileDashboardNav.classList.add('hidden');
            }
        });
    }

    // Interactive Core Gate check
    if (generateBtn) {
        generateBtn.addEventListener('click', (e) => {
            if (!currentUser) {
                e.preventDefault();
                e.stopImmediatePropagation();
                window.handleLogin();
                return false;
            }
            const currentCredits = parseInt(creditsCount ? creditsCount.textContent : '0') || 0;
            if (currentCredits < 2) {
                e.preventDefault();
                e.stopImmediatePropagation();
                alert('Insufficient credits! Is tool ko use karne ke liye 2 credits zaroori hain.');
                window.location.href = '/pricing/';
                return false;
            }
        }, true);
    }
</script>

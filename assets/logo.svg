<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Wrench (Diagonal from Top-Left to Bottom-Right) -->
  <g class="wrench" fill="#334155">
    <!-- Wrench Handle -->
    <path d="M 170 170 L 360 360 L 340 380 L 150 190 Z" />
    <!-- Rounded Handle End -->
    <circle cx="370" cy="370" r="32" />
    <circle cx="370" cy="370" r="12" fill="#f8fafc" class="bg-hole" />
    
    <!-- Wrench Head (Jaw) -->
    <path d="M 160 160 C 135 135 105 135 85 155 C 65 175 65 205 90 230 C 110 210 120 190 140 190 C 150 180 160 170 160 160 Z" />
    <!-- More precise wrench shape -->
    <path d="M 134.4 77.8 C 163.6 63.2 200.4 69.8 222.8 92.2 C 243.8 113.2 249.2 143.6 238.8 169.8 L 169.8 238.8 C 143.6 249.2 113.2 243.8 92.2 222.8 C 69.8 200.4 63.2 163.6 77.8 134.4 L 115 171.6 L 171.6 115 L 134.4 77.8 Z" />
  </g>

  <!-- Paintbrush (Diagonal from Bottom-Left to Top-Right) -->
  <g class="paintbrush">
    <!-- Brush Handle (Tapered) -->
    <path d="M 130 380 L 260 250 L 285 275 L 155 405 Z" fill="#475569" />
    <path d="M 130 380 C 120 390 110 400 120 410 C 130 420 140 410 155 405 Z" fill="#475569" />
    
    <!-- Ferrule (Metal Band) -->
    <path d="M 255 245 L 295 285 L 315 265 L 275 225 Z" fill="#64748b" />
    
    <!-- Brush Bristles (Teardrop shape pointing Top-Right) -->
    <path d="M 285 215 C 310 190 325 150 375 130 C 395 150 405 175 380 215 C 360 250 320 255 295 230 C 290 225 285 220 285 215 Z" fill="#1e293b" />
  </g>
</svg>

name = "toolimg-api"
main = "src/index.ts"
compatibility_date = "2024-03-20"
# Enable Node.js compat for packages like Razorpay or SDKs that might need it
compatibility_flags = ["nodejs_compat"]

# Cloudflare Browser Rendering Binding
browser = { binding = "MYBROWSER" }

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "toolimg-db"
database_id = "YOUR_D1_DATABASE_ID"

# (Optional) R2 Storage for caching or saving images
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "toolimg-bucket"

[vars]
# Put non-secret environment variables here
ENVIRONMENT = "production"

# SECRETS needed:
# Run `npx wrangler secret put <NAME>` for each of these:
# JWT_SECRET
# GEMINI_API_KEY
# RAZORPAY_KEY_ID
# RAZORPAY_KEY_SECRET
